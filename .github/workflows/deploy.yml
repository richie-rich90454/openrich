name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build all packages
        run: npm run build

      - name: Build VitePress docs
        run: npm run docs:build

      - name: Build playground
        run: cd playground && VITE_BASE_URL=/openrich/playground/ npm run build

      - name: Combine into publish directory
        run: |
          mkdir -p _site/playground
          cp -r docs/.vitepress/dist/* _site/
          cp -r playground/dist/* _site/playground/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
